*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  background:var(--noite);color:var(--texto);
  font-family:Poppins,system-ui,sans-serif;font-size:16px;line-height:1.5;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:var(--veu),var(--poster) center top/cover no-repeat;
}


html,body{height:100%}
body{height:100dvh;display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;position:relative}
@media (min-width:760px){.app{height:92dvh;margin:4dvh 0;background:rgba(17,12,8,.5);border:1px solid rgba(251,241,230,.14)}}

.chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(28px,6vh,56px) 22px 18px}
.head{margin-bottom:28px;animation:rise .9s var(--ease) both;text-shadow:0 1px 12px rgba(0,0,0,.5)}
h1{margin:0;font-family:"Bodoni Moda",Georgia,serif;font-weight:600;font-size:clamp(44px,13vw,64px);line-height:1.02;letter-spacing:-.005em;color:#fff;text-wrap:balance}
.regua{width:46px;height:2px;background:var(--areia);margin:22px 0 16px;transform-origin:left;animation:regua 1s .25s var(--ease) both}
.meta{margin:0;font-size:12.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}

/* conversa */
.msgs{display:flex;flex-direction:column;gap:10px}
.b{max-width:86%;padding:12px 16px;font-size:16px;line-height:1.45;border-radius:18px;overflow-wrap:anywhere;animation:pop .35s var(--ease) both}
.b.bot{align-self:flex-start;background:rgba(17,12,8,.8);border:1px solid rgba(251,241,230,.16);border-bottom-left-radius:4px;color:var(--texto)}
.b.me{align-self:flex-end;background:var(--areia);color:var(--noite);font-weight:500;border-bottom-right-radius:4px}
.b.bad{color:var(--erro);border-color:rgba(255,180,162,.45)}
.typing{display:flex;gap:5px;align-items:center;padding:16px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--salvia);animation:pulso 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}

/* estados (chips) */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;animation:pop .35s var(--ease) both}
.chips.yn{grid-template-columns:1fr 1fr}
.chip{padding:10px 0;border-radius:999px;border:1px solid rgba(251,241,230,.34);background:rgba(17,12,8,.78);color:var(--texto);font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:border-color .2s,background-color .2s}
.chip:hover,.chip:focus-visible{outline:0;border-color:var(--areia);background:rgba(248,217,189,.18)}

/* resumo */
.b.card{align-self:stretch;max-width:100%;padding:6px 16px 16px}
.b.card.off{opacity:.55;pointer-events:none}
.row{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid rgba(251,241,230,.1)}
.row .lab{flex:none;width:120px;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--salvia)}
.row .val{flex:1;min-width:0;font-size:16px;color:#fff;overflow-wrap:anywhere}
.row .ed,.acts .alt{flex:none;background:none;border:0;padding:4px 0 4px 8px;font:inherit;font-size:14px;font-weight:500;color:var(--areia);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button.primary{width:100%;margin-top:16px;padding:16px 18px;border:0;border-radius:3px;background:var(--areia);color:var(--noite);font:inherit;font-size:14px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background-color .3s var(--ease)}
button.primary:hover{background:var(--areia-2)}
.acts{display:flex;flex-wrap:wrap;gap:6px 18px;animation:pop .35s var(--ease) both}
.acts .alt{padding-left:0}

/* sucesso */
.selo{width:54px;height:54px;display:block;margin-bottom:12px}
.selo circle{stroke:var(--areia);stroke-width:1.4;fill:none;stroke-dasharray:158;stroke-dashoffset:158;animation:traco .9s .1s var(--ease) forwards}
.selo path{stroke:var(--areia);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:34;stroke-dashoffset:34;animation:traco .6s .7s var(--ease) forwards}
.okt{margin:0 0 6px;font-family:"Bodoni Moda",Georgia,serif;font-weight:500;font-size:28px;line-height:1.1;color:#fff}
.okp{margin:0}

/* campo de resposta */
.comp{flex:none;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(17,12,8,.86);border-top:1px solid rgba(251,241,230,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.comp input{flex:1;min-width:0;padding:13px 18px;border-radius:26px;background:rgba(6,4,3,.7);border:1px solid rgba(251,241,230,.34);color:var(--texto);font:inherit;font-size:16px;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.comp input::placeholder{color:rgba(251,241,230,.5)}
.comp input:focus{outline:0;border-color:var(--areia);box-shadow:0 0 0 1px var(--areia)}
.comp input:disabled{opacity:.55}
.comp button{flex:none;width:48px;height:48px;border:0;border-radius:50%;background:var(--areia);color:var(--noite);cursor:pointer;display:grid;place-items:center;transition:opacity .3s,background-color .3s}
.comp button:hover:not(:disabled){background:var(--areia-2)}
.comp button:disabled{opacity:.35;cursor:default}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes regua{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes traco{to{stroke-dashoffset:0}}
@keyframes pulso{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>

  storageBucket: "equipe-de-trabalho-ae029.firebasestorage.app",
  messagingSenderId: "832841108199",
  appId: "1:832841108199:web:df1c65102b94e0105f7042"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const $ = id => document.getElementById(id);
const chat = $('chat'), msgs = $('msgs'), inp = $('inp'), go = $('go');
const wait = ms => new Promise(r => setTimeout(r, ms));
const clean = v => v.trim().replace(/\s+/g, ' ');
const digits = v => v.replace(/\D/g, '');
const key = n => (n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const first = () => (data.lider || '').split(' ')[0];

const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const steps = [
  {k:'lider',  lab:'Líder',            q:'Qual é o nome completo da líder da caravana?', ph:'Nome e sobrenome', auto:'name', cap:'words',
   val:v => v.split(' ').length >= 2 ? '' : 'Preciso do nome e do sobrenome.'},
  {k:'tel',    lab:'Celular',          q:() => 'Prazer, ' + first() + '! Qual é o seu número de celular/WhatsApp, com DDD?', qe:'Qual é o número correto, com DDD?', ph:'(00) 00000-0000', tel:true, auto:'tel',
   val:v => digits(v).length >= 10 ? '' : 'Esse número parece incompleto. Informe com DDD.'},
  {k:'cidade', lab:'Cidade',           q:'De qual cidade é a caravana?', ph:'Sua cidade', auto:'address-level2', cap:'words',
   val:v => v.length >= 2 ? '' : 'Informe a cidade.'},
  {k:'estado', lab:'Estado',           q:'E em qual estado fica?', chips:UFS},
  {k:'pastor', lab:'Pastor',           q:'Qual é o nome completo do pastor da igreja?', ph:'Nome e sobrenome do pastor', cap:'words',
   val:v => v.split(' ').length >= 2 ? '' : 'Preciso do nome e do sobrenome.'},
  {k:'esposa', lab:'Esposa do pastor', q:'Qual é o nome completo da esposa do pastor?', ph:'Nome e sobrenome', cap:'words',
   val:v => v.split(' ').length >= 2 ? '' : 'Preciso do nome e do sobrenome.'},
  {k:'telEsposa', lab:'Celular dela',  q:'E o número de celular/WhatsApp da esposa do pastor, com DDD?', ph:'(00) 00000-0000', tel:true,
   val:v => digits(v).length >= 10 ? '' : 'Esse número parece incompleto. Informe com DDD.'},
  {k:'obs',    lab:'Observações',      q:'Há alguma informação que você gostaria de nos passar sobre a caravana?', ph:'Escreva aqui a informação', chips:['Sim','Não'], yn:true, max:500,
   val:v => v.length <= 500 ? '' : 'Pode resumir um pouco? O limite é de 500 caracteres.'}
];

const data = {};
let cur = -1, editing = false, locked = true, busy = false;

function scroll(){ requestAnimationFrame(() => chat.scrollTo({top: chat.scrollHeight, behavior: 'smooth'})); }
function add(cls, content){
  const d = document.createElement('div'); d.className = 'b ' + cls;
  if(typeof content === 'string') d.textContent = content; else d.appendChild(content);
  msgs.appendChild(d); scroll(); return d;
}
async function bot(content, cls = ''){
  const t = document.createElement('div'); t.className = 'b bot typing'; t.innerHTML = '<i></i><i></i><i></i>';
  msgs.appendChild(t); scroll();
  await wait(typeof content === 'string' ? Math.min(450 + content.length * 12, 1300) : 700);
  t.remove();
  return add('bot ' + cls, content);
}
function setComposer(on, s, off){
  inp.disabled = !on; go.disabled = !on; inp.value = '';
  if(on){
    inp.placeholder = s.ph || 'Digite aqui';
    inp.inputMode = s.tel ? 'tel' : 'text';
    inp.setAttribute('autocapitalize', s.cap || 'sentences');
    inp.setAttribute('autocomplete', s.auto || 'off');
    inp.focus({preventScroll: true});
  } else inp.placeholder = off || 'Aguarde…';
}
function showChips(s){
  const w = document.createElement('div'); w.className = 'chips' + (s.yn ? ' yn' : '');
  s.chips.forEach(u => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = u;
    b.onclick = () => s.yn ? simNao(u) : answer(u); w.appendChild(b);
  });
  msgs.appendChild(w); scroll();
}
function actions(list){
  const w = document.createElement('div'); w.className = 'acts';
  list.forEach(([txt, fn]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'alt'; b.textContent = txt;
    b.onclick = () => { w.remove(); fn(); }; w.appendChild(b);
  });
  msgs.appendChild(w); scroll();
}

async function ask(i, again){
  cur = i; locked = true; setComposer(false);
  const s = steps[i];
  const q = again && s.qe ? s.qe : (typeof s.q === 'function' ? s.q() : s.q);
  await bot(q);
  if(s.chips){ showChips(s); setComposer(false, null, 'Escolha uma opção acima'); }
  else setComposer(true, s);
  locked = false;
}
function simNao(u){
  if(locked) return;
  if(u === 'Não') return answer('', true);
  locked = true;
  document.querySelectorAll('.chips,.acts').forEach(c => c.remove());
  add('me', 'Sim');
  abrirTexto();
}
async function abrirTexto(){
  const s = steps[cur];
  await bot('Pode escrever aqui embaixo:');
  setComposer(true, s); locked = false;
  actions([['Na verdade, não tenho nada a informar', () => answer('', true)]]);
}
function answer(v, skip){
  if(locked) return;
  const s = steps[cur];
  if(!skip && s.val){ const e = s.val(v); if(e){ add('bot bad', e); return; } }
  locked = true;
  document.querySelectorAll('.chips,.acts').forEach(c => c.remove());
  add('me', skip ? 'Não' : v); data[s.k] = skip ? '' : v;
  if(editing){ editing = false; summary(); }
  else if(cur + 1 < steps.length) ask(cur + 1);
  else summary();
}
$('comp').addEventListener('submit', e => {
  e.preventDefault();
  const v = clean(inp.value); if(v) answer(v);
});
inp.addEventListener('input', () => {
  if(!steps[cur] || !steps[cur].tel) return;
  let d = digits(inp.value).slice(0, 11);
  if(d.length > 10)     d = d.replace(/^(\d{2})(\d{5})(\d{0,4}).*/, '($1) $2-$3');
  else if(d.length > 6) d = d.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
  else if(d.length > 2) d = d.replace(/^(\d{2})(\d{0,5}).*/, '($1) $2');
  else if(d.length)     d = '(' + d;
  inp.value = d;
});

async function summary(){
  cur = -1; locked = true; setComposer(false, null, 'Confira o resumo acima');
  await bot('Perfeito! Confere se está tudo certo:');
  const card = document.createElement('div');
  steps.forEach((s, i) => {
    const r = document.createElement('div'); r.className = 'row';
    const l = document.createElement('span'); l.className = 'lab'; l.textContent = s.lab;
    const v = document.createElement('span'); v.className = 'val'; v.textContent = data[s.k] || '—';
    const e = document.createElement('button'); e.type = 'button'; e.className = 'ed'; e.textContent = 'editar';
    e.onclick = () => edit(i, wrap);
    r.append(l, v, e); card.appendChild(r);
  });
  const b = document.createElement('button'); b.type = 'button'; b.className = 'primary'; b.textContent = 'Enviar inscrição';
  b.onclick = () => enviar(wrap);
  card.appendChild(b);
  const wrap = add('bot card', card);
}
function edit(i, card){
  if(busy) return;
  card.classList.add('off'); editing = true;
  add('me', 'Corrigir: ' + steps[i].lab);
  ask(i, true);
}

async function enviar(card){
  if(busy) return; busy = true; card.classList.add('off');
  add('me', 'Enviar inscrição');
  const id = key(data.cidade) + '_' + data.estado + '_' + digits(data.tel);
  try{
    await Promise.race([
      db.collection('caravanas_mulheres').doc(id).set({
        lider: data.lider, telefone: data.tel, cidade: data.cidade, estado: data.estado,
        pastor: data.pastor, esposaPastor: data.esposa, celularEsposa: data.telEsposa,
        observacao: data.obs || '',
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      }),
      new Promise((_, r) => setTimeout(() => r({code:'timeout'}), 15000))
    ]);
    const ok = document.createElement('div');
    ok.innerHTML = '<svg class="selo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="25"/><path d="M21 33l8 8 15-17"/></svg><h2 class="okt">Caravana inscrita!</h2><p class="okp"></p>';
    ok.querySelector('.okp').textContent = 'Obrigada, ' + first() + '. A caravana de ' + data.cidade + '/' + data.estado + ' será anunciada no sábado à noite. Estamos com grandes expectativas para este tempo! Será uma honra receber cada caravana e celebrar juntas tudo o que Deus fará. Amamos vocês e somos gratas por tudo!';
    await bot(ok);
    setComposer(false, null, 'Inscrição concluída');
    return;
  }catch(e){
    console.error(e);
    if(e.code === 'permission-denied'){
      await bot('Já existe uma inscrição com esse celular nessa cidade. Se precisar alterar algo, fale com a coordenação.', 'bad');
      actions([['Corrigir o celular', () => { busy = false; editing = true; add('me', 'Corrigir: Celular'); ask(1, true); }]]);
    } else {
      await bot('Não consegui enviar agora. Verifique a internet e tente de novo.', 'bad');
      actions([['Tentar de novo', () => { busy = false; summary(); }]]);
    }
    return;
  }
}

(async () => {
  await bot('Olá, queridas! A paz!');
  await bot('Para que possamos organizar a apresentação das caravanas, pedimos, por gentileza, que preencha as informações a seguir. As caravanas inscritas serão anunciadas no sábado à noite.');
  await bot('Estamos com grandes expectativas para tudo o que viveremos juntas!');
  ask(0);
})();
</script>
</body>
</html>
